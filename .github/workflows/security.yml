name: Security checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Install Gitleaks
        run: go install github.com/gitleaks/gitleaks/v8@v8.28.0
      - name: Scan committed history
        run: $(go env GOPATH)/bin/gitleaks detect --source . --redact
