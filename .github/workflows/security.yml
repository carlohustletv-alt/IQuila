name: Security checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify GPL source notices
        run: npm run check:license
      - name: Scan committed history
        run: docker run --rm --network none -v "$GITHUB_WORKSPACE:/repo:ro" zricethezav/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 detect --source=/repo --config=/repo/.gitleaks.toml --redact
